name: Robot Framework Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      - run: robot -d results test-cases/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: results/